name: Build & Deploy to hosting

# Запускается при каждом пуше в main + вручную из вкладки Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Новый пуш отменяет предыдущий незавершённый деплой (без наложений)
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Жёсткий лимит — никаких многочасовых зависаний
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://polytechpark.kz

      - name: Deploy via SFTP (lftp)
        env:
          DEPLOY_HOST: ${{ secrets.FTP_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set cmd:fail-exit yes;
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            open -u '$DEPLOY_USER','$DEPLOY_PASS' sftp://$DEPLOY_HOST:22;
            echo '--- где мы после входа (для проверки пути) ---';
            pwd;
            cls -l;
            mirror --reverse --delete --ignore-time --no-perms --verbose ./out/ /polytechpark.kz/ ;
          "
