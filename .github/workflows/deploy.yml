name: Build & Publish (deploy branch)

# Запускается при каждом пуше в main + вручную из вкладки Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Новый пуш отменяет предыдущий незавершённый прогон
concurrency:
  group: publish
  cancel-in-progress: true

# Нужно право записи, чтобы публиковать собранную статику в ветку deploy
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://polytechpark.kz
          NEXT_PUBLIC_API_URL: https://api.polytechpark.kz/api

      # Публикуем ТОЛЬКО собранную статику (папку out) в ветку deploy.
      # Оттуда её забирает Plesk Git.
      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
          enable_jekyll: true
          commit_message: "deploy: ${{ github.sha }}"
