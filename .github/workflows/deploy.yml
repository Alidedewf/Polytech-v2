name: Build & Deploy to hosting

# Запускается при каждом пуше в main + вручную из вкладки Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Новый пуш отменяет предыдущий незавершённый деплой (без наложений)
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://polytechpark.kz

      - name: Deploy via FTP (lftp)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set ftp:prefer-epsv no;
            set net:connection-limit 1;
            set net:max-retries 3;
            set net:timeout 25;
            set net:persist-retries 3;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --delete --ignore-time --no-perms --verbose --parallel=1 ./out/ ./ ;
          "
