<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Страница не найдена | PolyTech Park</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --blue: #0040bc;
        --navy: #002a7a;
        --ink: #111827;
        --gray: #494949;
        --line: #e5e7eb;
        --soft: #f5f7fa;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--soft);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image:
          linear-gradient(rgba(0,64,188,.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,64,188,.04) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .wrap { text-align: center; max-width: 560px; }
      .logo { height: 44px; width: auto; margin-bottom: 40px; }
      .code {
        font-size: clamp(72px, 18vw, 128px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--blue);
      }
      h1 {
        margin: 20px 0 0;
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 14px auto 0;
        max-width: 420px;
        color: var(--gray);
        font-size: 16px;
        line-height: 1.6;
      }
      .actions {
        margin-top: 34px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 28px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color .15s, border-color .15s, color .15s;
      }
      .btn-primary {
        background: var(--navy);
        color: #fff;
        box-shadow: 0 6px 16px rgba(0,42,122,.2);
      }
      .btn-primary:hover { background: var(--blue); }
      .btn-secondary {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover { border-color: var(--navy); color: var(--navy); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/Group.svg" alt="PolyTech Park" />
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>Возможно, страница была перемещена или удалена. Проверьте адрес или вернитесь на главную.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/ru/">На главную</a>
        <a class="btn btn-secondary" href="/ru/contacts/">Контакты</a>
      </div>
    </div>
  </body>
</html>
